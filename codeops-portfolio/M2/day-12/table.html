<!doctype html>
<html>
  <head>
    <title>table</title>
  </head>
  <body>
    <table>
      <caption>
        Habesha Eatery — main menu
      </caption>
      <thead>
        <tr>
          <th scope="col">Dish</th>
          <th scope="col">Price (ETB)</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row">Doro Wat</th>
          <td>320</td>
        </tr>
        <tr>
          <th scope="row">Shiro</th>
          <td>180</td>
        </tr>
        <tr>
          <th scope="row">Tibs</th>
          <td>360</td>
        </tr>
      </tbody>
    </table>

    <figure>
      <img
        src="./asset/image.png"
        alt="Rock-hewn church of Bete Giyorgis, Lalibela"
        width="640"
        height="420"
        loading="lazy"
      />
      <figcaption>
        Bete Giyorgis, one of the rock-hewn churches of Lalibela.
      </figcaption>
    </figure>

    <iframe
      src="https://maps.example/embed?q=Bole,Addis+Ababa"
      frameborder="0"
      width="100%"
      height="320"
      loading="lazy"
      title="Map Sowing Habesha Eatery in Bole"
    ></iframe>
  </body>
</html>
