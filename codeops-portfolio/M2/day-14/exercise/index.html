<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 14 Flexbox & Grid Exercises</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Exercise 1 -->
    <nav class="navbar">
      <div class="logo">Habesha Shop</div>

      <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">About</a>
        <button>Contact</button>
      </div>
    </nav>

    <!-- Exercise 2 -->
    <section class="card-container">
      <div class="card">
        <h3>Card 1</h3>
        <p>Sample content.</p>
      </div>

      <div class="card">
        <h3>Card 2</h3>
        <p>Sample content.</p>
      </div>

      <div class="card">
        <h3>Card 3</h3>
        <p>Sample content.</p>
      </div>

      <div class="card">
        <h3>Card 4</h3>
        <p>Sample content.</p>
      </div>
    </section>

    <!-- Exercise 3 -->
    <section class="gallery">
      <img src="https://picsum.photos/300/200?1" alt="Gallery image 1" />
      <img src="https://picsum.photos/300/200?2" alt="Gallery image 2" />
      <img src="https://picsum.photos/300/200?3" alt="Gallery image 3" />
      <img src="https://picsum.photos/300/200?4" alt="Gallery image 4" />
      <img src="https://picsum.photos/300/200?5" alt="Gallery image 5" />
      <img src="https://picsum.photos/300/200?6" alt="Gallery image 6" />
    </section>

    <!-- Exercise 4 -->
    <div class="layout">
      <header>Header</header>
      <aside>Sidebar</aside>
      <main>Main Content</main>
      <footer>Footer</footer>
    </div>

    <!-- Exercise 5 -->
    <section class="product-card">
      <span class="badge">ETB Sale</span>

      <h2>Ethiopian Coffee</h2>
      <p>Premium roasted coffee beans.</p>
      <p><strong>450 ETB</strong></p>
    </section>
  </body>
</html>
