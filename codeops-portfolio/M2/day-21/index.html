<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Document</title>
  </head>

  <body>
    <select name="theme" id="theme">
      <option value="Light">Light</option>
      <option value="Dark">Dark</option>
    </select>

    <form action="" class="signup-form" id="signup-form">
      <div>
        <input type="text" placeholder="Enter Full Name" id="username" />
        <span id="username-span"></span>
      </div>
      <div>
        <input type="phone" placeholder="Enter Phone Number" id="phone" />
        <span id="phone-span"></span>
      </div>
      <div>
        <input type="submit" value="Sign Up" />
      </div>
    </form>
    <div><p id="signup-count"></p></div>
    <script src="app.js"></script>
  </body>
</html>
